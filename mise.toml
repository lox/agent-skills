[tools]
node = "lts"
"npm:@haasstefan/skills-lint" = "0.1.2"

[tasks.install]
description = "Subscribe Codex and Amp to these skills with skillyard"
run = [
  "skillyard subscribe github:lox/agent-skills --include '*' --exclude notion --target codex --force",
  "skillyard subscribe github:lox/agent-skills --include '*' --exclude consulting-librarian --target amp --force",
]

[tasks.lint]
description = "Lint all SKILL.md files with skills-lint"
run = "skills-lint"
